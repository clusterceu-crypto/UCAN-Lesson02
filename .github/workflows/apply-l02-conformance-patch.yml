name: Apply Lesson 02 resource recovery patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore learner-facing examples, resources and videos
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/resource_patch.py
          python /tmp/resource_patch.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Lesson 02 examples resources and videos'
          git push
