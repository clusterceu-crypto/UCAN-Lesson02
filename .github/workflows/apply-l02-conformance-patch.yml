name: Apply Lesson 02 conformance patch

on:
  push:
    paths:
      - '.github/workflows/apply-l02-conformance-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-html:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch learner-facing HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old in s:
                  s = s.replace(old, new, 1)
                  return
              if new in s:
                  return
              raise SystemExit(f'Missing expected source fragment for {label}: {old[:120]}')

          replace_once(
              '>Практичні орієнтири<',
              '>Практичне застосування<',
              'navigation label'
          )

          replace_once(
              '<td>Приклади, ресурси й відео</td>',
              '<td>Практичне застосування</td>',
              'lesson map title'
          )

          replace_once(
              '<td>Використати підтверджені міжнародні орієнтири та зберегти Open Flags без вигаданих кейсів.</td>',
              '<td>Перевірити, як кліматично нейтральна візія допомагає ухвалювати рішення в умовах відновлення, обмеженого бюджету та потреби у довірі.</td>',
              'lesson map activity'
          )

          replace_once(
              'Силабус Заняття 02 підкреслює важливість city vision, mission and climate strategy. Для UCAN це означає: громада має навчитися формулювати не лише перелік проєктів, а коротку управлінську відповідь на питання: яким містом ми хочемо бути і як це має змінити наші рішення?',
              'Для громади важливо сформулювати не лише перелік проєктів, а коротку управлінську відповідь на питання: яким містом ми хочемо бути і як це має змінити наші рішення?',
              'page 4 introduction'
          )

          replace_once(
              '<h2 id="ukraine-title">Український контекст: без вигаданого кейсу</h2>',
              '<h2 id="ukraine-title">Український контекст</h2>',
              'Ukrainian context heading'
          )

          replace_once(
              'У цьому занятті український кейс не додається як приклад, доки він не має SVS-підтвердження. Натомість учасники працюють із власним викликом громади і формулюють візію без прив’язки до неперевіреної історії успіху.',
              'Під час заняття учасники працюють із власним викликом громади й формулюють візію без прив’язки до неперевіреної історії успіху.',
              'Ukrainian context paragraph'
          )

          replace_once(
              'Збережену або надруковану картку можна використати в Занятті 03 як основу для перевірки того, які технології, дані та цифрові рішення можуть підтримати цю візію.',
              'Збережену або надруковану картку можна передати AI-асистенту для аналізу, уточнення або покращення формулювань. Вона також стане основою для Заняття 03, де команда перевірятиме, які технології, дані та цифрові рішення можуть підтримати цю візію.',
              'AI assistant note'
          )

          start_marker = '<section aria-labelledby="orientation-title">'
          start = s.find(start_marker)
          if start != -1:
              end = s.find('</section>', start)
              if end == -1:
                  raise SystemExit('Unclosed orientation section')
              s = s[:start] + s[end + len('</section>'):]

          forbidden = [
              'Open Flags',
              'SVS-статус',
              'Силабус Заняття 02',
              'Green City Accord',
              'TOMORROW Transition Toolbox'
          ]
          leftovers = [term for term in forbidden if term in s]
          if leftovers:
              raise SystemExit(f'Forbidden learner-facing terms remain: {leftovers}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Lesson 02 HTML conformance patch 01'
          git push
