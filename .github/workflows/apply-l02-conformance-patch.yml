name: Apply Lesson 02 resource recovery patch

on:
  push:
    paths:
      - '.github/workflows/apply-l02-conformance-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-html:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore learner-facing examples, resources and videos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<h2>Quick Check</h2>', '<h2>Швидка перевірка</h2>')

          block = '''
          <section aria-labelledby="examples-title">
            <h2 id="examples-title">Корисні орієнтири для міської візії</h2>
            <p>Ці ресурси допомагають перевірити, чи візія громади охоплює ключові міські виклики та чи може вона перейти від загального бачення до практичних рішень.</p>
            <div class="orientation-grid">
              <article>
                <h3>Green City Accord</h3>
                <p>Європейська рамка для комплексного погляду на якість повітря, воду, природу й біорізноманіття, циркулярну економіку, відходи та шумове середовище.</p>
                <p><a class="button secondary" href="https://regions-and-cities.ec.europa.eu/cities-portal/eu-initiatives-cities/green-city-accord_en" target="_blank" rel="noopener noreferrer">Відкрити Green City Accord</a></p>
              </article>
              <article>
                <h3>TOMORROW Transition Toolbox</h3>
                <p>Практичний набір інструментів, який показує, як перейти від міського бачення до дорожньої карти, партнерств і послідовних дій.</p>
                <p><a class="button secondary" href="https://www.citiesoftomorrow.eu/resources/toolbox/" target="_blank" rel="noopener noreferrer">Відкрити Transition Toolbox</a></p>
              </article>
            </div>
          </section>
          <section aria-labelledby="video-title">
            <h2 id="video-title">Відео про циркулярну економіку</h2>
            <p>Дві короткі лекції допоможуть поглибити розуміння циркулярної економіки та її значення для українських громад.</p>
            <div class="orientation-grid">
              <article>
                <h3>Вступ до циркулярної економіки</h3>
                <p>Базове пояснення принципів циркулярної економіки та переходу від лінійної моделі використання ресурсів.</p>
                <p><a class="button primary" href="https://www.youtube.com/watch?v=gWjJ80S-S_8" target="_blank" rel="noopener noreferrer">Переглянути відео</a></p>
              </article>
              <article>
                <h3>Потенціал циркулярної економіки в Україні</h3>
                <p>Огляд можливостей застосування циркулярних підходів в українському контексті.</p>
                <p><a class="button primary" href="https://www.youtube.com/watch?v=JRiTGhkzSkM&t=1s" target="_blank" rel="noopener noreferrer">Переглянути відео</a></p>
              </article>
            </div>
          </section>
'''

          if 'id="examples-title"' not in s:
              marker = '''        </section>
        
      </div>
    </section>

    <section id="page-6"'''
              replacement = '''        </section>
''' + block + '''      </div>
    </section>

    <section id="page-6"'''
              if marker not in s:
                  raise SystemExit('Page 5 insertion marker not found')
              s = s.replace(marker, replacement, 1)

          forbidden = ['Open Flags', 'SVS-статус', 'Силабус Заняття 02']
          leftovers = [term for term in forbidden if term in s]
          if leftovers:
              raise SystemExit(f'Forbidden learner-facing terms remain: {leftovers}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Lesson 02 examples resources and videos'
          git push
